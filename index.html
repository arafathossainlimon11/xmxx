<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XMXX - Ultra HD Streaming & Video Platform</title>
  
  <!-- SEO & Open Graph Meta Tags -->
  <meta name="description" content="Watch high quality trending clips and media on XMXX streaming platform.">
  <meta name="keywords" content="video, streaming, ultra hd, trending clips, online media">
  <meta name="theme-color" content="#0b0e14">
  <meta property="og:title" content="XMXX - Ultra HD Streaming">
  <meta property="og:description" content="Watch top-tier trending video content.">
  <meta property="og:image" content="https://i.ibb.co.com/23JbPYWT/file-00000000ddf48208b16918ae2957f76d.png">

  <!-- Favicon Icon -->
  <link rel="icon" type="image/png" href="https://i.ibb.co.com/23JbPYWT/file-00000000ddf48208b16918ae2957f76d.png">

  <!-- FontAwesome Icons & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <!-- Main Custom Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="nav-container">
      <a href="#" class="brand-logo">
        <img src="https://i.ibb.co.com/23JbPYWT/file-00000000ddf48208b16918ae2957f76d.png" alt="XMXX Logo" id="siteLogo">
      </a>

      <!-- Search Box with Icon -->
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="searchInput" placeholder="Search videos, categories, tags...">
        <button id="searchBtn">Search</button>
      </div>

      <!-- User Badge / Age Warning Badge -->
      <div class="nav-badge">
        <span class="badge-18">18+</span>
        <span class="badge-hd">4K Ultra HD</span>
      </div>
    </div>
  </header>

  <!-- Category Pills / Filter Section -->
  <nav class="category-bar">
    <div class="category-container">
      <button class="cat-pill active" data-category="all"><i class="fa-solid fa-fire"></i> Trending</button>
      <button class="cat-pill" data-category="popular"><i class="fa-solid fa-star"></i> Popular</button>
      <button class="cat-pill" data-category="latest"><i class="fa-solid fa-clock"></i> New Arrivals</button>
      <button class="cat-pill" data-category="top_rated"><i class="fa-solid fa-thumbs-up"></i> Top Rated</button>
      <button class="cat-pill" data-category="hd"><i class="fa-solid fa-compact-disc"></i> 4K Quality</button>
    </div>
  </nav>

  <!-- Main Content Body -->
  <main class="main-wrapper">
    <div class="section-header">
      <h1 class="section-title" id="pageTitle">Trending Content</h1>
      <span class="results-count" id="resultCount">Showing dynamic feed</span>
    </div>

    <!-- Dynamic Media Grid Container -->
    <div id="videoGrid" class="video-grid">
      <!-- Loading Skeleton Cards will be generated by JavaScript initially -->
    </div>
  </main>

  <!-- Ultra Professional Video Player Modal Popup -->
  <div id="videoModal" class="modal-overlay">
    <div class="modal-content">
      <button class="modal-close" id="closeModalBtn">&times;</button>
      <div class="player-wrapper" id="playerContainer">
        <!-- Dynamic Player/Image Container Embeds Here -->
      </div>
      <div class="modal-details">
        <h2 id="modalTitle" class="modal-title">Media Title</h2>
        <div class="modal-meta">
          <span id="modalViews"><i class="fa-solid fa-eye"></i> 0 Views</span>
          <span id="modalQuality" class="badge-hd">HD</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer Section -->
  <footer class="footer">
    <div class="footer-container">
      <div class="footer-brand">
        <img src="https://i.ibb.co.com/23JbPYWT/file-00000000ddf48208b16918ae2957f76d.png" alt="XMXX Logo" class="footer-logo">
        <p>&copy; 2026 XMXX Platform. All rights reserved.</p>
      </div>
      <div class="footer-disclaimer">
        <p>Disclaimer: This platform uses automated third-party API indexing services. All content is served directly from remote origins.</p>
      </div>
    </div>
  </footer>

  <!-- Main JavaScript File -->
  <script src="script.js"></script>
</body>
</html>
